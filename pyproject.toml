[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "draft-advisor"
version = "0.1.0"
description = "Local, read-only Sleeper draft monitor"
requires-python = ">=3.11"

[project.scripts]
draft-advisor = "draft_advisor.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
